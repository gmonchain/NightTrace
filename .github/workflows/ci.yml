name: CI

# The enforcement locus (ARCHITECTURE-SPINE.md AD-30).
#
# This file is the only place gates are declared blocking. A gate may not be
# described as CI-blocking until this pipeline runs it, so gates belonging to
# later stories are appended here by the story that builds them:
#
#   - content validation + aliases (AD-9, AD-18) — Story 3.1 (emission bank,
#     glyph set); the Alien-voice half lands in Story 5.6
#   - migration idempotency (AD-22)      — Story 2.5
#   - golden-seed replay (AD-3)          — Story 2.2
#
# Two gates are already appended below, by the stories that built them:
# Story 1.4's grain-reproducibility gate (`npm run grain:check`) and Story
# 1.5's claims lint (`npm run claims:check`, AD-16 / NFR-18).
#
# No placeholder gate is declared here: an unimplemented gate that passes reads
# as coverage, which is worse than an absent one.
#
# Story 1.2's gates are *not* on that list because `npm run verify` already runs
# both of them: the token-sync test (AD-17) is a Jest suite under the `ui`
# project, so `npm test` runs it, and the AD-17 raw-value lint is a rule defined
# in `eslint.config.js` that `npm run lint` runs — `src/__tests__/boundary.test.ts`
# only *tests* that the rule fires, it is not where the rule runs.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only reads the checkout. The repository default
# grants more than `verify` needs, and an unbounded job can sit for the
# six-hour default, so the job carries its own wall-clock ceiling too.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `verify` is typecheck + lint + test; the two Jest projects are the
      # `test` step's own project list, and the ESLint boundary rules run as
      # part of `lint` and again, per fixture, in the boundary test.
      - name: Verify
        run: npm run verify

      # The claims lint (AD-16 / NFR-18): no shipped sentence may assert anything
      # about the real world. `verify` runs the suite that *tests* the gate;
      # this step is where the gate actually runs over the declared
      # string-surface set, so a banned term or a `%` fails the build.
      - name: Claims lint (no real-world assertion)
        run: npm run claims:check

      # The grain tile's byte-for-byte reproducibility gate. `verify` cannot see
      # a drifted `assets/grain.png`, so this step is what makes the drift
      # CI-visible.
      - name: Grain tile is reproducible
        run: npm run grain:check

      # The launch AC's only CI-visible proxy. `verify` cannot see a broken
      # route tree: expo-router scans `src/app/**` with `require.context`, so a
      # file under it importing a module that does not exist fails the bundle
      # while every unit test stays green. A loopback added route fixtures
      # under `src/app/**` and took this export from exit 0 to exit 1 with a
      # fully green suite — this step is what makes that failure CI-visible.
      - name: Bundle (iOS export)
        run: npm run bundle
